name: Preparar OituCards V1.2

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  unpack:
    if: ${{ hashFiles('OituCards-v1.2.zip') != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extrair V1.2 para a raiz
        run: |
          rm -rf .unpack
          mkdir .unpack
          unzip -q OituCards-v1.2.zip -d .unpack
          cp -a .unpack/OituCards-v1.2/. .
          rm -rf .unpack OituCards-v1.2.zip

      - name: Commit da estrutura definitiva
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Expand OituCards V1.2 project files"
          git push
